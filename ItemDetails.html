<script>
const SERVER_URL =
"https://script.google.com/macros/s/AKfycbyuuZzLIAbcpPrz1y3Gt3gcXqL7AmDEXIlcHZ4wNiAVASj1bTWWZRtBGkD8E8aNgyAguA/exec";

let allItems = [];

async function apiGet(sheetName) {

    const response = await fetch(
        `${SERVER_URL}?action=${sheetName}`
    );

    return await response.json();
}

async function apiPost(sheetName, data) {

    const response = await fetch(
        SERVER_URL,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: sheetName,
                data: data
            })
        }
    );

    return await response.json();
}

async function loadItems() {

    try {

        const result = await apiGet("items");

        if (result.status !== "SUCCESS") {
            alert(result.message);
            return;
        }

        allItems = result.data || [];

        renderItems(allItems);

        updateStatistics();

    } catch (ex) {

        console.error(ex);

        alert("فشل الاتصال بالخادم");

    }
}

function renderItems(items) {

    const container =
        document.getElementById("itemsContainer");

    container.innerHTML = "";

    if (items.length === 0) {

        container.innerHTML = `
        <div class="bg-white p-5 rounded shadow text-center">
            لا توجد أصناف حالياً
        </div>`;

        return;
    }

    items.forEach(item => {

        container.innerHTML += `
        <div class="bg-white p-4 rounded-lg shadow-sm border-r-4 border-blue-500 flex flex-col justify-between">

            <div>

                <h4 class="font-bold text-base">
                    ${item.Name || ""}
                </h4>

                <p class="text-xs text-blue-700">
                    🏢 ${item.Company || "-"}
                </p>

                <p class="text-xs text-slate-500">
                    🧪 ${item.ActiveIngredient || "-"}
                </p>

            </div>

            <div class="text-xs mt-3">

                <p>
                    🔑 ${item.Code || ""}
                </p>

                <p>
                    ⏳ ${item.ExpiryMonths || 0} شهر
                </p>

                <p>
                    ⚠️ حد أدنى:
                    ${item.MinQty || 0}
                </p>

            </div>

            <button
                onclick='showItemDetails(${JSON.stringify(item)})'
                class="mt-3 flat-3d-btn w-full bg-indigo-600 text-white font-bold py-2 rounded text-sm">
                عرض التفاصيل
            </button>

        </div>
        `;
    });
}

function showItemDetails(item) {

    document.querySelector("#detailsFormSection h2").innerText =
        item.Name || "";

    document.querySelector(
        "#detailsFormSection .text-sm.font-bold.text-slate-500 span"
    ).innerText =
        item.Code || "";

    document.querySelector(
        "#detailsFormSection .text-sm.font-bold.text-blue-700"
    ).innerText =
        "🏢 الشركة: " + (item.Company || "");

    document.querySelector(
        "#detailsFormSection .text-xs.text-slate-600"
    ).innerText =
        "🧪 المادة الفعالة: " +
        (item.ActiveIngredient || "");

    document
        .getElementById("detailsFormSection")
        .scrollIntoView({
            behavior: "smooth"
        });
}

function updateStatistics() {

    document.getElementById(
        "lblStatShortages"
    ).innerText =
        allItems.filter(
            x => Number(x.MinQty || 0) > 0
        ).length + " صنف";

    document.getElementById(
        "lblStatExpired"
    ).innerText = "0 صنف";

    document.getElementById(
        "lblStatCapital"
    ).innerText =
        allItems.length + " صنف";

    document.getElementById(
        "lblStatProfit"
    ).innerText =
        "متصل بالسيرفر";
}

async function addNewItem() {

    const code =
        prompt("كود الصنف");

    if (!code)
        return;

    const name =
        prompt("اسم الصنف");

    if (!name)
        return;

    const company =
        prompt("الشركة");

    const ingredient =
        prompt("المادة الفعالة");

    const result =
        await apiPost(
            "items",
            {
                Code: code,
                Name: name,
                Company: company,
                ActiveIngredient: ingredient,
                ExpiryMonths: 36,
                MinQty: 5
            });

    alert(result.message);

    if (
        result.status === "SUCCESS"
    ) {
        loadItems();
    }
}

document
    .querySelector(
        ".bg-blue-700"
    )
    .addEventListener(
        "click",
        addNewItem
    );

document
    .getElementById(
        "txtSearch"
    )
    .addEventListener(
        "input",
        function (e) {

            const search =
                e.target.value
                .toLowerCase();

            const filtered =
                allItems.filter(
                    x =>
                        (x.Name || "")
                        .toLowerCase()
                        .includes(search)
                        ||
                        (x.Code || "")
                        .toLowerCase()
                        .includes(search)
                );

            renderItems(filtered);
        });

window.onload =
    loadItems;
</script>
